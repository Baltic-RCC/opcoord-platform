name: CI - Build base image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for base image (e.g., v1.0.0, latest)'
        required: true
        default: 'latest'

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker tag
        id: vars
        run: |
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKER_USERNAME }}/opcoord-base" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}

      - name: Tag and push latest
        if: startsWith(steps.vars.outputs.version, 'v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}:latest

      - name: Display Success Message
        run: echo "'opcoord-base' image has been built and pushed manually."