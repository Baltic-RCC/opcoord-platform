name: Sync CROSA bundle from GitLab

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      gitlab_ref:
        description: 'GitLab branch or tag to pull from'
        required: false
        default: 'main'

jobs:
  sync-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "GITLAB_REF=${{ inputs.gitlab_ref || 'main' }}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Download CROSA bundle from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_BASE_URL: ${{ secrets.GITLAB_BASE_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_BUNDLE_PATH: ${{ secrets.GITLAB_BUNDLE_PATH }}
        run: |
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${GITLAB_BASE_URL}/api/v4/projects/${GITLAB_PROJECT_ID}/repository/archive.zip?sha=${GITLAB_REF}&path=${GITLAB_BUNDLE_PATH}" \
            --output /tmp/crosa_bundle.zip

      - name: Validate bundle
        env:
          GITLAB_BUNDLE_PATH: ${{ secrets.GITLAB_BUNDLE_PATH }}
        run: |
          uv run scripts/validate_bundle.py \
            /tmp/crosa_bundle.zip \
            --bundle-path "${GITLAB_BUNDLE_PATH}"

      - name: Extract bundle into resources
        env:
          GITLAB_BUNDLE_PATH: ${{ secrets.GITLAB_BUNDLE_PATH }}
        run: |
          TMP_DIR=$(mktemp -d)
          unzip -q /tmp/crosa_bundle.zip -d "$TMP_DIR"
          TOP_DIR=$(ls "$TMP_DIR")
          rm -rf resources/process_bundles/crosa
          mkdir -p resources/process_bundles/crosa
          cp -r "$TMP_DIR/$TOP_DIR/${GITLAB_BUNDLE_PATH}/." resources/process_bundles/crosa/
          rm -rf "$TMP_DIR"

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain resources/process_bundles/crosa)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch, commit and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-crosa-bundle-${{ env.TIMESTAMP }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add resources/process_bundles/crosa/
          git commit -m "chore: sync crosa bundle from gitlab [${{ env.GITLAB_REF }}]"
          git push origin "$BRANCH"
          printf '## CROSA Bundle Sync\n\nSynced from GitLab ref: `%s`\nRun timestamp: `%s`\n\n### Validation results\nAll checks passed:\n- Directory structure verified\n- Required files present (config.json, i18n.json, css/style.css, template/sar.handlebars)\n- JSON files valid\n' \
            "${{ env.GITLAB_REF }}" "${{ env.TIMESTAMP }}" > /tmp/pr_body.md
          gh pr create \
            --title "chore: sync crosa bundle from gitlab" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH"

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "Bundle is already up to date, no PR needed."
