name: Build and publish dev images

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., v1.0.0)'
        required: true

jobs:
  build-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Variables
        run: |
          echo "PUBLICATOR=opcoord-card-publicator" >> $GITHUB_ENV
          echo "DATE_TAG=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "LATEST_TAG=latest" >> $GITHUB_ENV

      - name: Compute IMAGE_TAG
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # manual run: use the provided version
            TAG="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # tag push: use the tag name
            TAG="${GITHUB_REF_NAME}"
          else
            # branch push: snap-<sha> (change to "${GITHUB_REF_NAME}" if you prefer)
            TAG="dev-${{ env.DATE_TAG }}"
          fi

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Computed IMAGE_TAG=$TAG"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: card_publicator/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.PUBLICATOR }}:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.PUBLICATOR }}:${{ env.LATEST_TAG }}
